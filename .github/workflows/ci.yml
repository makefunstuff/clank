# Build and test on every push, on the platforms the releases are cut for.
#
# Warnings are errors here, which is the standard the code is held to: a warning is a
# defect nobody has read yet. The doc conventions are checked too — every markdown file
# is rewrapped by `scripts/reflow-docs.py --check`, so the repo's ~80-column convention
# cannot drift one hand-written paragraph at a time.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      # rustup and cargo ship with the runner images; adding a toolchain action would be
      # one more third-party dependency for a one-line command.
      - name: Show the toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --locked

      # The suite drives the real binaries against a stub endpoint, so it needs no model,
      # no key and no network.
      - name: Test
        run: cargo test --locked

      - name: The docs are wrapped to their own convention
        # fixtures/ is excluded: those files are test input, and their bytes are the test.
        run: python3 scripts/reflow-docs.py --check $(git ls-files '*.md' ':!fixtures/*')

  # Packaging gate: catches missing files, bad manifest metadata, and lockfile
  # drift before a real crates.io publish. Needs no token.
  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package as crates.io would
        run: cargo publish --dry-run --locked
